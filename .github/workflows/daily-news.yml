name: Daily healthcare news update

# Manual fallback for refreshing news.json (headlines, plus the summary and
# analysis when ANTHROPIC_API_KEY is set).
#
# The daily run is NOT done here. A Claude Code Routine fires every morning
# at 21:00 UTC / 06:00 KST and does the whole job — headlines, research,
# analysis, commit — on the account's existing Claude subscription, so it
# costs nothing per run. The cron below is therefore disabled; this workflow
# stays as a manual escape hatch from the Actions tab ("Run workflow").

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest healthcare news
        run: node scripts/fetch-news.mjs

      # Needs the ANTHROPIC_API_KEY repository secret. Without it the script
      # exits 0 without writing, and the page falls back to headlines only —
      # so a missing key or a bad API day never blocks the headline refresh.
      - name: Summarize and analyze
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/analyze-news.mjs

      - name: Commit and push if news.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- news.json; then
            echo "No news changes."
            exit 0
          fi
          git add news.json
          git commit -m "chore: update daily healthcare news"
          git push
