<style>
/* Layout: 한 화면에 한 장씩 넘기는 카드 덱 (시작 → 11문항 → 분석 → 결과 6장) */
:root{--bg:#0b1311;--surface:#111b18;--ink:#ede6d8;--muted:#9aa49d;--line:#24322d;--teal:#a9c4b4;--gold2:#cfdfd4;--brass:#a9c4b4;--brass-ink:#10201a;--warn:#e0957a;--green:#163029;
--disp:"Noto Serif KR","Nanum Myeongjo",serif;--body:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body)}
.wrap{max-width:600px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(30px,7vw,42px)}h2{font-size:clamp(24px,5.5vw,30px)}h3{font-size:18px}
.hd{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.brand{font-family:var(--disp);font-size:17px;color:var(--ink)}
.step{font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--line);border-radius:2px;margin:10px 0 20px;overflow:hidden}.prog b{display:block;height:100%;background:var(--teal);transition:width .3s}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:min(600px,80vh);display:flex;overflow:hidden;touch-action:pan-y}
.pg{flex:1;display:flex;flex-direction:column;gap:18px;padding:28px 24px 20px;min-width:0;animation:in .32s ease both}
.pg.l{animation-name:inl}
@keyframes in{from{opacity:.3;transform:translateX(32px)}}@keyframes inl{from{opacity:.3;transform:translateX(-32px)}}
@media (prefers-reduced-motion:reduce){.pg{animation:none}.prog b{transition:none}}
.grow{flex:1}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--teal);font-weight:700}
.lead,.hint{color:var(--muted);margin:0}.hint{font-size:13px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt b{font-family:var(--disp);font-weight:400;font-size:34px;line-height:1;color:var(--teal);width:1.1em;text-align:center}
.opt strong{display:block;font-size:16px}.opt small{display:block;color:var(--muted);font-size:13px}
.opt:hover{border-color:var(--teal)}
.opt[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.opt[aria-pressed="true"] b,.opt[aria-pressed="true"] small{color:var(--surface)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.ghost{font:inherit;font-weight:700;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:8px 16px;cursor:pointer}
.ghost:disabled{opacity:.35;cursor:default}
.cta{font:inherit;font-family:var(--disp);font-size:20px;background:var(--teal);color:var(--surface);border:0;border-radius:99px;padding:14px 28px;cursor:pointer;align-self:flex-start}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:var(--line);cursor:pointer}.dots button[aria-current="true"]{background:var(--teal);width:20px;border-radius:4px}
.facts{display:flex;gap:24px}.facts span{color:var(--muted);font-size:13px}.facts b{font-family:var(--disp);font-weight:400;font-size:28px;color:var(--ink);margin-right:2px}
.tag{position:relative;background:var(--brass);color:var(--brass-ink);border-radius:20px 60px 60px 20px;padding:18px 28px 18px 58px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.tag::before{content:"";position:absolute;left:20px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.tag .t{font-family:var(--disp);font-size:46px;letter-spacing:.06em;line-height:1}
.tag .kw{display:flex;flex-wrap:wrap;gap:6px}.tag .kw span{font-size:13px;font-weight:700;border:1.5px solid currentColor;border-radius:99px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
.teaser{background:var(--bg);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.teaser b{font-family:var(--disp);font-weight:400;font-size:24px}.teaser em{font-style:normal;font-family:var(--disp);font-size:24px;color:var(--teal)}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.size{font-family:var(--body);font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:5px;color:var(--muted)}
.note{margin:4px 0 0;color:var(--muted)}
.ring{--v:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--disp);font-size:28px;color:var(--teal);font-variant-numeric:tabular-nums}.ring small{font-size:14px}
.avoid .ring{background:conic-gradient(var(--warn) calc(var(--v)*1%),var(--line) 0)}.avoid .ring span{color:var(--warn)}
.mt{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
@media (max-width:460px){.mt{grid-template-columns:auto 1fr}}
.s5{display:flex;gap:3px}.s5 i{flex:1;height:7px;border-radius:2px;background:var(--line)}.s5 i.on{background:var(--teal)}
ul.pc{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14px}
ul.pc li{padding-left:20px;position:relative}ul.pc li::before{position:absolute;left:0;font-weight:700}
li.p::before{content:"+";color:var(--teal)}li.c::before{content:"!";color:var(--warn);left:4px}
.rows{display:grid}.rows>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.rows h3 small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:6px}
.rows .v{font-family:var(--disp);font-size:24px;color:var(--warn)}.rows ul{grid-column:1/-1}
.scroll{overflow:auto;max-height:min(440px,56vh);border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-size:12px;color:var(--muted);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--line);min-width:70px}.bar b{display:block;height:100%;border-radius:3px;background:var(--teal)}
.chk{margin:0;padding-left:20px;display:grid;gap:4px}
a{color:var(--teal)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.load{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:16px}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.alert{background:var(--warn);color:var(--surface);border-radius:14px;padding:18px 20px}.alert .eyebrow{color:inherit;opacity:.85;margin-bottom:4px}
.no{font-family:var(--disp);font-weight:400;color:var(--muted);margin-right:8px}.good .v{color:var(--teal)}
body{word-break:keep-all;overflow-wrap:break-word}
.grp{display:grid;gap:2px}.gh{font-size:18px;display:flex;align-items:baseline;gap:8px;margin-top:8px}.gh small{font-family:var(--body);font-size:12px;color:var(--muted)}
.det{display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--line)}.dh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.dh .v{font-family:var(--disp);font-size:24px;color:var(--teal)}
.com{background:var(--bg);border-radius:12px;padding:12px 16px;display:grid;gap:6px}

/* 고급형 리디자인: 딥 그린 + 세이지, 순차 등장 애니메이션 */
body{background:radial-gradient(120% 60% at 50% -10%,#1d3a31 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink)}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}h1{font-size:clamp(28px,7vw,40px);line-height:1.3}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.02em}
.prog b{background:linear-gradient(90deg,#5f7f70,var(--gold2))}
.stage{background:linear-gradient(180deg,#14211d,var(--surface));border-color:#2b3c35;box-shadow:0 30px 60px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(207,223,212,.08)}
.eyebrow{color:var(--gold2);letter-spacing:.14em}
.tag{background:linear-gradient(135deg,#dfe8e2,#9fb8a9 60%,#c3d4c9);color:var(--brass-ink);border-radius:16px 48px 48px 16px;padding:16px 24px 16px 52px;box-shadow:0 12px 30px -12px rgba(150,180,163,.5);overflow:hidden}
.tag::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4s ease-in-out 1s infinite}
.tag::before{background:var(--surface)}.tag .t{font-family:var(--disp);font-weight:900;font-size:40px}
.kw.sub{font-size:13px;font-weight:700;opacity:.8}
.facts b{font-family:var(--disp);font-weight:700;color:var(--gold2)}
.cta{font-family:var(--disp);font-weight:700;background:linear-gradient(135deg,#e3ebe5,#a7bfb0);color:var(--brass-ink);position:relative;overflow:hidden;box-shadow:0 10px 30px -10px rgba(150,180,163,.7);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta.big{align-self:stretch;display:flex;justify-content:center;align-items:center;gap:12px;font-size:20px;padding:18px 24px;animation:pulse 2.4s ease-in-out 1.2s infinite}
.cta.big i{font-style:normal;transition:transform .2s;animation:nudge 1.6s ease-in-out infinite}
.cta.big::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-100%);animation:shine 3s ease-in-out .8s infinite}
.tap{margin:-8px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
.opt{background:rgba(255,255,255,.02);border-color:#2b3c35;transition:border-color .2s,background .2s,transform .15s}
.opt:hover{border-color:var(--brass)}.opt:active{transform:scale(.98)}
.opt b{font-family:var(--disp);font-weight:900;color:var(--gold2)}
.opt[aria-pressed="true"]{background:linear-gradient(135deg,#dfe8e2,#a7bfb0);border-color:transparent;color:var(--brass-ink)}
.opt[aria-pressed="true"] b,.opt[aria-pressed="true"] small{color:var(--brass-ink)}
.ghost{border-color:#33453e}.dots button[aria-current="true"]{background:var(--gold2)}
.alert{background:linear-gradient(135deg,#5a2418,#8c3b26);color:#f6e3d8;border:1px solid rgba(224,149,122,.35)}
.com{background:rgba(255,255,255,.03);border:1px solid var(--line)}
.chips span{background:rgba(255,255,255,.03)}
.good .v,.dh .v{color:var(--gold2)}.v{font-family:var(--disp);font-weight:900}
.s5 i.on{background:linear-gradient(90deg,#9fb8a9,var(--gold2))}
.spin{border-top-color:var(--gold2)}
.pg>*{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.pg>:nth-child(2){animation-delay:.06s}.pg>:nth-child(3){animation-delay:.12s}.pg>:nth-child(4){animation-delay:.18s}.pg>:nth-child(5){animation-delay:.24s}.pg>:nth-child(6){animation-delay:.3s}.pg>:nth-child(n+7){animation-delay:.36s}
.opt,.rows>div,.det,.grp>.pc{animation:up .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.15s + var(--i,0)*70ms)}
@keyframes up{from{opacity:.05;transform:translateY(14px)}}
@keyframes shine{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px -10px rgba(150,180,163,.7),0 0 0 0 rgba(207,223,212,.45)}50%{box-shadow:0 10px 30px -10px rgba(150,180,163,.7),0 0 0 10px rgba(207,223,212,0)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.pg>*,.opt,.rows>div,.det,.grp>.pc,.cta.big,.cta.big i,.cta.big::after,.tag::after{animation:none}}
.dz{grid-column:1/-1;margin:0;font-size:13px;line-height:1.5;color:var(--muted)}.dz span{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--teal);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.dz .mv{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd"><span class="brand">MBTI 견종 매칭</span><span class="step" id="step"></span></header>
  <div class="prog"><b id="bar"></b></div>
  <main class="stage" id="stage"></main>
</div>

<script>
// 이름|크기(1소 2중 3대)|운동량|애착(외로움)|사교성|독립성|훈련성|털관리|털빠짐|짖음|아이친화|호기심 (1~5)|특징|주의
const B=`말티즈|1|3|5|3|1|3|4|1|4|2|3|사람 곁을 좋아하는 애교쟁이|분리불안과 짖음 관리가 필요해요
토이 푸들|1|3|4|3|2|5|5|1|3|3|5|영리하고 털이 거의 안 빠져요|4~6주마다 미용이 필요해요
포메라니안|1|3|4|2|2|3|4|4|5|2|4|작지만 당당한 경계견|짖음이 많고 털도 많이 빠져요
치와와|1|3|5|1|2|2|1|2|4|1|3|한 사람에게 깊이 애착해요|낯을 가리고 예민해 어린아이와는 주의가 필요해요
시츄|1|2|4|4|3|3|4|1|2|4|2|느긋하고 온순한 집순이|눈·피부 관리, 배변훈련에 인내가 필요해요
비숑 프리제|1|3|5|5|1|3|5|1|3|4|4|밝고 사교적인 솜뭉치|미용비가 들고 혼자 있는 걸 힘들어해요
요크셔 테리어|1|3|4|2|3|3|4|1|4|2|4|용감하고 호기심 많은 테리어|짖음과 고집이 있어요
진돗개|2|4|2|1|5|2|2|5|2|2|2|한 가족에게 충성하는 독립파|낯선 사람·개를 경계하고 털갈이가 심해요
웰시 코기 펨브로크|2|4|4|4|2|4|2|5|4|4|4|명랑하고 똑똑한 목양견|털 빠짐이 많고 비만·허리 관리가 필요해요
골든 리트리버|3|4|5|5|1|5|3|5|2|5|4|다정한 가족견의 대표|운동량과 털 빠짐이 모두 많아요
래브라도 리트리버|3|5|4|5|2|5|1|4|2|5|4|에너지 넘치는 모범생|어릴 때 물건을 많이 망가뜨려요
시바견|1|3|2|2|5|2|2|5|2|2|3|깔끔하고 독립적인 성격|고집이 세고 털갈이가 심해요
닥스훈트|1|3|4|2|3|2|1|2|5|2|4|용감한 사냥개 출신 (미니어처 기준)|허리 디스크에 취약하고 짖음이 많아요
프렌치 불독|2|2|5|4|2|3|1|3|1|4|3|조용하고 익살맞은 동반자|더위와 호흡기 질환에 약해요
비글|2|5|3|5|3|2|1|3|5|5|5|에너지와 호기심이 넘쳐요|하울링·고집이 있고 운동량이 매우 많아요
보더 콜리|2|5|3|3|2|5|3|4|3|3|5|가장 영리한 견종으로 꼽혀요|매일 고강도 운동과 두뇌 놀이가 필수예요
미니어처 슈나우저|1|3|4|3|2|4|4|1|4|4|4|영리하고 씩씩한 소형 슈나우저|짖음이 있고 정기 미용이 필요해요
재패니즈 스피츠|1|3|4|3|2|4|3|4|3|4|3|명랑한 흰 털 반려견|털 빠짐이 많고 경계할 때 짖는 아이도 있어요
사모예드|2|4|5|5|1|3|5|5|4|5|4|늘 웃는 얼굴의 친화왕|털 관리가 엄청나고 더위에 약해요
시베리안 허스키|2|5|3|5|3|1|3|5|4|4|5|자유로운 썰매견|탈출·하울링, 많은 운동량. 초보에겐 버거워요

const group=(R,bad)=>{const G=bad?[1,2,3].map(z=>pick(R,z,1)):tiers(R),H=bad?[1,2,3].map(z=>[SIZE[z]+'견',SZ[z]]):TIER,cnt={};G.flat().forEach(x=>(bad?x.cons:x.pros).forEach(t=>cnt[t]=(cnt[t]||0)+1));
 const com=Object.keys(cnt).filter(t=>cnt[t]>=3).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3),skip=new Set(com);
 return (com.length?`<div class="com"><h3>${bad?'여러 견종에 공통으로 걸리는 점':'여러 견종에 공통으로 잘 맞는 점'}</h3><ul class="pc">${li(bad?'c':'p',com)}</ul></div>`:'')+G.map((a,k)=>{const L=bad?'cons':'pros',gc=a.length<2?[]:a[0][L].filter(t=>!skip.has(t)&&a.every(x=>x[L].includes(t))).slice(0,1),sk=new Set([...skip,...gc]);return `<section class="grp"><h3 class="gh">${H[k][0]}<small>${H[k][1]}</small></h3>${gc.length?`<ul class="pc">${li(bad?'c':'p',gc.map(t=>H[k][0]+' 공통: '+t))}</ul>`:''}${!bad&&a[0].sc<50?'<p class="hint">지금 생활에선 이 그룹의 견종이 전반적으로 쉽지 않아요.</p>':''}<div class="rows${bad?'':' good'}">${a.map((x,j)=>row(x,j+1,!bad,sk)).join('')}</div></section>`}).join('')};
const detail=(x,j)=>{const d=x.d;return `<article class="det"><div class="dh"><h3><span class="no">${j}</span>${d.n}<span class="size">${SIZE[d.z]}</span></h3><span class="v">${x.sc}%</span></div><p class="note">${d.note}</p>${dzl(d)}
<div class="mt">${MET.map(([l,k])=>`<span>${l}</span><div class="s5">${[1,2,3,4,5].map(i=>`<i${i<=d[k]?' class="on"':''}></i>`).join('')}</div>`).join('')}</div>
<ul class="pc">${li('p',x.pros)}${li('c',x.cons.slice(0,2).concat(d.warn))}</ul></article>`};

function rPage(){const R=results(),T=type(),i=S.ri;let h='';
if(i===0)h=`<div class="alert"><div class="eyebrow">경고 · 지금의 생활 기준</div><h2>${T.join('')}인 당신이<br>절대 키우면 안 되는 견종</h2></div><p class="hint">아이들의 잘못이 아니에요. 지금의 생활과 맞지 않을 뿐이에요. 크기별로 3마리씩 골랐어요.</p>${group(R,1)}<p class="hint">그렇다면 나와 맞는 아이는 누구일까요? 다음 장에서 만나요.</p>`;
else if(i===1)h=`<div class="tag"><span class="t">${T.join('')}</span><span class="kw">${T.map(c=>`<span>${KW[c]}</span>`).join('')}</span></div><h2>나와 잘 맞는 견종</h2>
 <div class="chips">${QS.slice(4).map(q=>`<span>${q.o.find(o=>o[0]===S.st[q.k])[3]}</span>`).join('')}</div>${group(R,0)}<p class="hint">한 마리씩 자세히 보려면 다음 장으로 넘겨 주세요.</p>`;
else if(i<=4){const t=i-2,L=tiers(R)[t];h=`<div class="eyebrow">잘 맞는 견종 · ${TIER[t][1]}</div><h2>${TIER[t][0]} ${L.length}마리 자세히</h2><p class="hint">유전·호발 질환은 그 견종에서 상대적으로 잘 나타나는 질환이에요. 모든 아이에게 생기는 건 아니에요.</p><div>${L.map((x,j)=>detail(x,j+1)).join('')}</div>`}
else h=`<div class="eyebrow">입양 전 약속</div><h2>평생을 약속하기 전에, 마지막으로 물어봐요</h2>
 <ul class="chk"><li>15년 남짓한 이 아이의 일생을 끝까지 함께할 수 있나요?</li><li>사료와 병원, 미용까지 매달 드는 비용을 감당할 수 있나요?</li><li>이사, 결혼, 출산, 이직으로 삶이 바뀌어도 이 아이의 자리는 그대로인가요?</li><li>생후 2개월이 지나면 동물등록을 꼭 해 주세요.</li></ul>
 <div><h3 style="margin-bottom:4px">사지 말고, 먼저 만나 주세요</h3><p class="hint">보호소에도 이 목록 속 견종과 세상에 하나뿐인 믹스견들이 가족을 기다리고 있어요. <a href="https://www.animal.go.kr" target="_blank" rel="noopener">국가동물보호정보시스템</a>, <a href="https://pawinhand.kr" target="_blank" rel="noopener">포인핸드</a>에서 만날 수 있어요.</p></div>
 <p class="hint">결과는 견종의 일반적인 경향을 담은 참고 자료예요. 같은 견종이라도 아이마다 성격이 모두 다르니, 꼭 직접 만나 보고 수의사·훈련사와 상담해 주세요. 분양을 받는다면 부모견의 유전자·건강 검사 여부도 꼭 확인해 주세요.</p>
 <div class="btns"><button type="button" class="cta" data-act="restart">처음부터 다시</button></div>`;
return h+`<div class="grow"></div>`+nav('rprev','rnext',`<div class="dots">${RL.map((l,j)=>`<button type="button" data-act="dot" data-i="${j}" aria-label="${l}" aria-current="${j===i}"></button>`).join('')}</div>`,i>0,i<RL.length-1)}

function view(dir){
  const m=S.mode,h=m==='intro'?intro():m==='q'?qPage():m==='load'?loadPg():rPage();
  document.getElementById('stage').innerHTML=`<div class="pg${dir<0?' l':''}">${h}</div>`;
  document.getElementById('step').textContent=m==='q'?`질문 ${S.qi+1} / ${QS.length}`:m==='r'?`결과 ${S.ri+1} / ${RL.length}`:m==='load'?'분석 중':'';
  document.getElementById('bar').style.width=(m==='q'?S.qi/QS.length*100:m==='intro'?0:100)+'%';
  const st=document.getElementById('stage');st.querySelectorAll('.opt,.rows>div,.det,.grp>.pc').forEach((e,k)=>e.style.setProperty('--i',k));
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)st.querySelectorAll('.v').forEach(e=>{const n=parseInt(e.textContent),t0=performance.now();if(!(n>0))return;const f=t=>{const k=Math.min(1,(t-t0)/800);e.textContent=Math.round(n*(1-Math.pow(1-k,3)))+'%';if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
  const top=document.querySelector('.wrap').getBoundingClientRect().top;if(top<0)window.scrollBy(0,top);
}
function step(dir){
  if(S.mode==='q'){
    if(dir<0){if(S.qi)S.qi--;else S.mode='intro'}
    else if(S.qi<QS.length-1)S.qi++;
    else{R=null;S.mode='load';view(1);setTimeout(()=>{S.mode='r';S.ri=0;view(1)},1600);return}
  }else if(S.mode==='r'){const k=S.ri+dir;if(k<0||k>=RL.length)return;S.ri=k}else return;
  view(dir);
}
document.getElementById('stage').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='start'){S.mode='q';S.qi=0;view(1)}
  else if(a==='opt'){if(lock)return;S.st[QS[S.qi].k]=b.dataset.v;lock=true;b.parentNode.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));setTimeout(()=>{lock=false;step(1)},220)}
  else if(a==='prev'||a==='rprev')step(-1);
  else if(a==='next'||a==='rnext')step(1);
  else if(a==='dot'){const j=+b.dataset.i,d=j<S.ri?-1:1;S.ri=j;view(d)}
  else if(a==='restart'){S={st:{},mode:'intro',qi:0,ri:0};R=null;view(-1)}
});
document.addEventListener('keydown',e=>{if(S.mode!=='r')return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
// 가로 스와이프만 페이지를 넘겨요. 위아래 스크롤은 넘기지 않아요.
let tx=null,ty=0;const stg=document.getElementById('stage');
stg.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
stg.addEventListener('touchend',e=>{if(tx===null||S.mode!=='r')return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2)step(dx<0?1:-1)});
stg.addEventListener('touchcancel',()=>{tx=null},{passive:true});
function start(d){if(d&&d.S){S=d.S;if(S.mode==='load')S.mode='r'}view(1)}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
